settings.key.uploads_max_file_size_mb.label: 'Tamaño máximo por fichero (MB)'
settings.key.uploads_max_file_size_mb.description: 'Tamaño máximo de cada fichero que se sube (adjuntos de actividades y de tareas de sanción, plantillas PDF e importaciones). El servidor también aplica sus propios límites de PHP (upload_max_filesize y post_max_size): si son menores, prevalecen y la aplicación muestra el máximo real en el aviso.'
settings.key.uploads_max_total_size_mb.label: 'Tamaño máximo total por envío (MB)'
settings.key.uploads_max_total_size_mb.description: 'Suma máxima de los ficheros que se pueden enviar de una sola vez en un formulario (varios adjuntos a la vez). Debe ser igual o mayor que el tamaño máximo por fichero y no puede superar el post_max_size de PHP. Cada fichero se carga entero en memoria al guardarse: valores muy altos exigen un memory_limit de PHP acorde.'

settings.key.updates_check_enabled.label: 'Avisar de versiones nuevas'
settings.key.updates_check_enabled.description: 'El panel de administración consulta, como mucho una vez al día, la última versión publicada en GitHub y avisa a los administradores globales si hay una más reciente que la instalada. Solo se pide el número de versión: no se envía ningún dato del centro ni de las personas. Desactívalo en servidores sin salida a internet o si no quieres que el servidor haga esa consulta.'

settings.key.maintenance_enabled.label: 'Modo mantenimiento'
settings.key.maintenance_enabled.description: 'Con el modo mantenimiento activado, solo los administradores globales pueden usar la aplicación: el resto del profesorado, esté o no con la sesión iniciada, ve una página de mantenimiento. Los avisos por correo y las demás tareas automáticas siguen funcionando.'

settings.key.events_publish_scope.label: 'Quién puede publicar actividades'
settings.key.events_publish_scope.description: 'Quién puede crear, editar y eliminar las actividades del calendario del centro. «Equipo directivo» incluye a los administradores del centro y de la plataforma. Con «Todos», cualquier docente del centro puede publicar actividades, pero solo ve en el listado, modifica y elimina las suyas; la coordinación de actividades (perfil del centro) gestiona todas, como la dirección.'
settings.key.events_publish_scope.choice.all: 'Todos'
settings.key.events_publish_scope.choice.management: 'Equipo directivo'

settings.key.features_exits.label: 'Salidas del aula'
settings.key.features_exits.description: 'Activa o desactiva la sección Salidas (autorizar y registrar las salidas del aula, y el pase prioritario del alumnado). Desactivada, desaparece del menú, de los accesos rápidos y de la ficha del alumno, y sus direcciones dejan de funcionar. Los datos ya registrados se conservan.'
settings.key.features_absences.label: 'Ausencias del profesorado'
settings.key.features_absences.description: 'Activa o desactiva la sección Ausencias (ausencias del profesorado y sus actividades para el alumnado). Desactivada, desaparece del menú, de los accesos rápidos y del calendario, y sus direcciones dejan de funcionar. Los datos ya registrados se conservan.'
settings.key.features_daily_notes.label: 'Notas del día'
settings.key.features_daily_notes.description: 'Activa o desactiva la sección Notas (anotaciones diarias sobre el alumnado y sus avisos al llegar al umbral de parte). Desactivada, desaparece del menú, de los accesos rápidos, de la ficha del alumno y de las alertas, y sus direcciones dejan de funcionar. Los datos ya registrados se conservan.'
settings.key.features_events.label: 'Actividades de centro'
settings.key.features_events.description: 'Activa o desactiva las Actividades (jornadas, salidas, charlas… con su tipo, lugar y coordinación). Desactivadas, desaparecen la pestaña del calendario, los avisos del panel de inicio, las guardias y el tablón, y los catálogos de tipos, y sus direcciones dejan de funcionar. Los datos ya registrados se conservan.'
settings.key.features_bookings.label: 'Reservas de recursos'
settings.key.features_bookings.description: 'Activa o desactiva las Reservas (recursos compartidos como dependencias o carros de portátiles, con su calendario semanal y mensual y el listado de reservas). Desactivadas, desaparecen del menú y del panel de inicio, y las direcciones de la sección y del catálogo de recursos del centro dejan de funcionar. Los datos ya registrados se conservan.'
settings.key.features_issues.label: 'Incidencias'
settings.key.features_issues.description: 'Activa o desactiva el módulo de Incidencias (avisar al responsable de una avería o un problema, con su tipo, prioridad, observaciones, adjuntos e historial). Desactivado, desaparece del menú, del panel de inicio, de la búsqueda y de las reservas, y sus direcciones y la configuración de tipos y prioridades dejan de funcionar. Los datos ya registrados se conservan.'
settings.key.features_utilities.label: 'Utilidades'
settings.key.features_utilities.description: 'Activa o desactiva la sección Utilidades (generador de calendarios y calculadora de fechas, herramientas personales del profesorado). Desactivada, desaparece del menú y sus direcciones dejan de funcionar. Los calendarios ya guardados se conservan.'
settings.key.bookings_max_advance_days.label: 'Antelación máxima de las reservas (días)'
settings.key.bookings_max_advance_days.description: 'Cuántos días por delante de hoy, como máximo, se puede reservar un recurso (0-365). Con 0 no hay límite. Cada categoría de recursos puede fijar su propio límite, que sustituye a este; la dirección y los responsables de la categoría no tienen límite.'
settings.key.features_sanction_tasks.label: 'Tareas de sanción'
settings.key.features_sanction_tasks.description: 'Activa o desactiva las tareas de sanción: que se pidan tareas al profesorado de un grupo cuando se sanciona a un alumno. Desactivadas, las sanciones nuevas no generan tareas ni avisos, desaparecen el menú, los recordatorios y el enlace público para el alumno, y sus direcciones dejan de funcionar. Las tareas ya creadas se conservan.'

# ── Avisos que se reciben: un interruptor por tipo de aviso, en los tres niveles (global, centro y docente) ──
settings.key.notifications_receive_report_created.label: 'Parte registrado'
settings.key.notifications_receive_report_created.description: 'Si se recibe el aviso de que se ha registrado un parte (sea por correo o como línea del resumen diario). Desactivado, no llega aunque el centro lo envíe. Cada nivel puede fijarlo para los inferiores: la plataforma para todos los centros y el centro para todo su profesorado.'
settings.key.notifications_receive_report_notified.label: 'Parte notificado a la familia'
settings.key.notifications_receive_report_notified.description: 'Si se recibe el aviso de que un parte se ha notificado a la familia (sea por correo o como línea del resumen diario). Desactivado, no llega aunque el centro lo envíe. Cada nivel puede fijarlo para los inferiores: la plataforma para todos los centros y el centro para todo su profesorado.'
settings.key.notifications_receive_report_modified.label: 'Parte modificado'
settings.key.notifications_receive_report_modified.description: 'Si se recibe el aviso de que se ha modificado un parte (sea por correo o como línea del resumen diario). Desactivado, no llega aunque el centro lo envíe. Cada nivel puede fijarlo para los inferiores: la plataforma para todos los centros y el centro para todo su profesorado.'
settings.key.notifications_receive_report_deleted.label: 'Parte eliminado'
settings.key.notifications_receive_report_deleted.description: 'Si se recibe el aviso de que se ha eliminado un parte (sea por correo o como línea del resumen diario). Desactivado, no llega aunque el centro lo envíe. Cada nivel puede fijarlo para los inferiores: la plataforma para todos los centros y el centro para todo su profesorado.'
settings.key.notifications_receive_report_prescribed.label: 'Parte prescrito'
settings.key.notifications_receive_report_prescribed.description: 'Si se recibe el aviso de que un parte se ha marcado como prescrito (sea por correo o como línea del resumen diario). Desactivado, no llega aunque el centro lo envíe. Cada nivel puede fijarlo para los inferiores: la plataforma para todos los centros y el centro para todo su profesorado.'
settings.key.notifications_receive_report_auto_prescribed.label: 'Parte prescrito automáticamente'
settings.key.notifications_receive_report_auto_prescribed.description: 'Si se recibe el aviso de que un parte ha prescrito automáticamente (sea por correo o como línea del resumen diario). Desactivado, no llega aunque el centro lo envíe. Cada nivel puede fijarlo para los inferiores: la plataforma para todos los centros y el centro para todo su profesorado.'
settings.key.notifications_receive_report_sanctioned.label: 'Parte incorporado a una sanción'
settings.key.notifications_receive_report_sanctioned.description: 'Si se recibe el aviso de que un parte se ha incorporado a una sanción (sea por correo o como línea del resumen diario). Desactivado, no llega aunque el centro lo envíe. Cada nivel puede fijarlo para los inferiores: la plataforma para todos los centros y el centro para todo su profesorado.'
settings.key.notifications_receive_report_sanctionable_committee.label: 'Parte sancionable (comisión de convivencia)'
settings.key.notifications_receive_report_sanctionable_committee.description: 'Si se recibe el aviso a la comisión de convivencia de que un parte todavía puede ser sancionado (sea por correo o como línea del resumen diario). Desactivado, no llega aunque el centro lo envíe. Cada nivel puede fijarlo para los inferiores: la plataforma para todos los centros y el centro para todo su profesorado.'
settings.key.notifications_receive_sanction_notified.label: 'Sanción notificada a la familia'
settings.key.notifications_receive_sanction_notified.description: 'Si se recibe el aviso de que una sanción se ha notificado a la familia (sea por correo o como línea del resumen diario). Desactivado, no llega aunque el centro lo envíe. Cada nivel puede fijarlo para los inferiores: la plataforma para todos los centros y el centro para todo su profesorado.'
