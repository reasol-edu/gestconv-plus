; PHP runtime configuration for GestConv+ (Windows / FrankenPHP)
extension_dir = ext

extension = openssl
extension = intl
extension = pdo_sqlite
extension = sqlite3
extension = mbstring
extension = zip

; Los formularios de adjuntos (actividades y tareas de sanción) admiten varios
; ficheros a la vez: el límite por fichero (10 MB por defecto) y el total por envío
; (50 MB por defecto) se configuran en la aplicación, pero los de PHP mandan por
; encima. post_max_size debe cubrir la suma de los ficheros (si se supera, PHP
; descarta todo el cuerpo de la petición, token CSRF incluido). Sin esto, PHP usa
; sus valores por defecto (2M/8M), muy por debajo de lo que admite la aplicación.
; En Linux y macOS estos valores se aplican desde el Caddyfile (php_ini).
upload_max_filesize = 16M
post_max_size       = 64M
max_file_uploads    = 50
memory_limit        = 256M

; Producción: con display_errors activado, un aviso de PHP al arrancar la petición
; (p. ej. «POST demasiado grande») se escribe antes que las cabeceras y rompe la
; sesión y la respuesta (pantalla en blanco).
display_errors = Off
log_errors     = On
