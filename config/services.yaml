# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Versión de la aplicación
    app.name:                   "GestConv+"
    # Repositorio del proyecto: enlaces del pie y consulta de la última versión publicada (releases de GitHub).
    app.repository:             "https://github.com/reasol-edu/gestconv-plus"
    app.version:                "1.32.0"
    app.pub_date:               "2026-11-13"
    # Zona horaria de la aplicación (la que ven las personas y la de «hoy», los tramos y los avisos). Las fechas con hora
    # siguen guardándose en UTC; ver App\Doctrine\Type\UtcDateTimeImmutableType. Se cambia con APP_TIMEZONE.
    env(APP_TIMEZONE):          "Europe/Madrid"
    app.timezone:               "%env(APP_TIMEZONE)%"
    # Carpeta de las copias de seguridad guardadas en el servidor. Tiene que ser una carpeta que sobreviva a las
    # actualizaciones (en Docker, var/ es un volumen; en el binario nativo se apunta a data/backups con APP_BACKUP_DIR).
    env(APP_BACKUP_DIR):        "%kernel.project_dir%/var/backups"
    app.backup_dir:             "%env(APP_BACKUP_DIR)%"
    # Estado de una restauración (bloqueo, resultado y hora de la última): ficheros, no base de datos, porque es la base de
    # datos lo que se sustituye. Debe ser común a todos los procesos de la aplicación (web, consola y worker).
    app.restore_state_dir:      "%kernel.project_dir%/var/restore"
    # Tiempo mínimo (en microsegundos) que tarda la rama POST de la solicitud
    # de restablecimiento de contraseña. Iguala las dos ramas (usuario existe /
    # no existe) para que el envío síncrono del correo no permita enumerar
    # cuentas por timing. En el entorno de tests se anula (services_test.yaml).
    app.password_reset.request_min_duration_us: 900000
    # Dirección base del manual web al que enlaza el icono de ayuda de cada pantalla. Una instalación sin salida
    # a internet puede apuntar a una copia propia del manual con APP_HELP_URL.
    env(APP_HELP_URL):          "https://reasol-edu.github.io/gestconv-plus/"
    app.help_url:               "%env(APP_HELP_URL)%"

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones



