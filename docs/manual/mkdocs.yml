site_name: Manual de usuario de GestConv+
site_description: Gestión de la convivencia
site_url: https://reasol-edu.github.io/gestconv-plus/
# Versión y fecha del release en el pie de la web. Fuente única: config/services.yaml.
# El target "docs-web" del Makefile exporta MANUAL_COPYRIGHT con app.version y
# app.pub_date; al construir directamente con mkdocs (sin la variable) se usa el valor por defecto.
copyright: !ENV [MANUAL_COPYRIGHT, "Manual de usuario de GestConv+"]
docs_dir: .
site_dir: ../manual-site
use_directory_urls: false
repo_url: https://github.com/reasol-edu/gestconv-plus

exclude_docs: |
  README.md
  requirements.txt
  _build.html
  *.pdf

theme:
  name: material
  language: es
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    primary: deep purple
    accent: deep purple
  icon:
      repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.integrate

extra_css:
  - assets/theme.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Introducción: index.md
  - Instalación y puesta en marcha: 01-instalacion-y-puesta-en-marcha.md
  - Preparar el curso académico: 02-preparar-el-curso-academico.md
  - Usar la aplicación: 03-usar-la-aplicacion.md
  - 'Convivencia: el trabajo del profesorado': 04-convivencia-profesorado.md
  - 'Convivencia: la comisión y las sanciones': 05-convivencia-comision.md
  - 'Convivencia: la administración': 06-convivencia-administracion.md
  - Salidas del aula: 07-salidas.md
  - Ausencias y guardias: 08-ausencias-y-guardias.md
  - Reservas de recursos: 09-reservas.md
  - Incidencias: 10-incidencias.md
  - Calendario, actividades y tablón: 11-calendario-actividades-y-tablon.md
  - Administrar el centro educativo: 12-administrar-el-centro.md
  - Administrar la plataforma: 13-administrar-la-plataforma.md
  - Permisos de un vistazo: 14-permisos-de-un-vistazo.md
  - 'Anexo: Resolución de problemas': 15-resolucion-de-problemas.md
  - 'Anexo: Glosario': 16-glosario.md
